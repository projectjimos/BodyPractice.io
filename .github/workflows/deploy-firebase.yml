name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodypractice-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "$FIREBASE_PROJECT_ID" ]] && missing+=("FIREBASE_PROJECT_ID")
          [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]] && missing+=("FIREBASE_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Firebase deployment is missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate audited anatomy data
        run: |
          npx --yes tsx@latest -e "import('./src/data/auditedOrganData.ts').then(() => console.log('PASS: audited anatomy data loads without runtime errors.'))"

      - name: Validate 700 practice tests
        run: |
          npx --yes tsx@latest -e "import('./src/data/quizBanks.ts').then(({ PRACTICE_TESTS }) => { const entries = Object.entries(PRACTICE_TESTS); if (entries.length !== 7) throw new Error('Expected 7 body-system test collections.'); let totalTests = 0; for (const [system, tests] of entries) { if (tests.length !== 100) throw new Error(system + ' has ' + tests.length + ' tests instead of 100.'); const testIds = new Set(tests.map((t) => t.id)); if (testIds.size !== 100) throw new Error(system + ' contains duplicate test IDs.'); for (const test of tests) { if (test.questions.length !== 10) throw new Error(test.id + ' has ' + test.questions.length + ' questions instead of 10.'); const questionIds = new Set(test.questions.map((q) => q.id)); if (questionIds.size !== 10) throw new Error(test.id + ' repeats a question inside the same test.'); for (const q of test.questions) { if (q.options.length !== 4) throw new Error(q.id + ' does not have 4 options.'); if (q.correctAnswerIndex < 0 || q.correctAnswerIndex > 3) throw new Error(q.id + ' has an invalid answer index.'); } } totalTests += tests.length; console.log('PASS: ' + system + ' has 100 valid 10-question tests.'); } if (totalTests !== 700) throw new Error('Expected 700 total tests; found ' + totalTests + '.'); console.log('PASS: 700 total practice tests validated.'); })"

      - name: Build web app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Smoke test live Firebase app
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 \
            "$BASE_URL/" -o /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/home.html
          grep -q '<title>BodyPractice.io</title>' /tmp/home.html
          echo "PASS: Firebase homepage is reachable and branded BodyPractice.io."

      - name: Browser smoke test live app
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const base = `https://${process.env.FIREBASE_PROJECT_ID}.web.app`;
            const browser = await chromium.launch({ headless: true, channel: 'chrome' });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', err => pageErrors.push(err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            await page.goto(base, { waitUntil: 'networkidle' });
            await page.locator('header h1').filter({ hasText: 'BodyPractice' }).waitFor({ timeout: 15000 });
            if ((await page.title()) !== 'BodyPractice.io') throw new Error(`Unexpected page title: ${await page.title()}`);
            await page.locator('img[alt="BodyPractice.io human body logo"]').waitFor();

            const homeText = await page.locator('body').innerText();
            for (const forbidden of ['BioBot', 'AI Analogy Generator', 'More AI Analogies', 'AI Quiz']) {
              if (homeText.includes(forbidden)) throw new Error(`Removed AI feature still visible: ${forbidden}`);
            }
            console.log('PASS: removed AI controls remain absent.');

            await page.getByRole('button', { name: /Quiz Master/i }).click();
            await page.getByText('100 Practice Tests', { exact: true }).waitFor();
            let testButtons = page.locator('[data-testid="practice-test-button"]');
            if ((await testButtons.count()) !== 100) throw new Error(`Expected 100 test buttons; found ${await testButtons.count()}.`);
            await testButtons.first().click();
            await page.getByText('Test 1', { exact: true }).waitFor();
            await page.getByText('Question 1 of 10', { exact: true }).waitFor();
            await page.getByText('A', { exact: true }).first().click();
            await page.getByRole('button', { name: 'Submit Answer' }).click();
            await page.getByText('Explanation:').waitFor();
            console.log('PASS: a 10-question practice test opens and scores an answer.');

            await page.getByRole('button', { name: /Choose Another Test/i }).click();
            testButtons = page.locator('[data-testid="practice-test-button"]');
            if ((await testButtons.count()) !== 100) throw new Error('Test selector did not return 100 tests.');

            const systemsRow = page.getByText('Body Systems:', { exact: true }).locator('..');
            const systemButtons = systemsRow.locator('button');
            const systemCount = await systemButtons.count();
            if (systemCount !== 7) throw new Error(`Expected 7 body-system buttons; found ${systemCount}.`);
            for (let i = 0; i < systemCount; i += 1) {
              await systemButtons.nth(i).click();
              await page.getByText('100 Practice Tests', { exact: true }).waitFor();
              const count = await page.locator('[data-testid="practice-test-button"]').count();
              if (count !== 100) throw new Error(`Body system ${i + 1} exposes ${count} tests instead of 100.`);
            }
            console.log('PASS: all 7 body systems expose 100 selectable tests.');

            await page.getByRole('button', { name: /Explorer/i }).click();
            const search = page.getByPlaceholder(/Search part/i);
            await search.fill('Retina');
            await page.getByRole('button').filter({ hasText: 'Retina' }).first().click();
            await page.getByRole('heading', { name: 'Retina' }).waitFor();
            console.log('PASS: Anatomy search returns a selectable structure.');

            if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`Browser console errors: ${consoleErrors.join(' | ')}`);

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
