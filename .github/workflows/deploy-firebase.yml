name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodypractice-production
  cancel-in-progress: true

env:
  CLOUD_RUN_SERVICE: bodypractice
  CLOUD_RUN_REGION: northamerica-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "$FIREBASE_PROJECT_ID" ]] && missing+=("FIREBASE_PROJECT_ID")
          [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]] && missing+=("FIREBASE_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Firebase deployment is missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate production build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Enable required Google Cloud APIs
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project "$FIREBASE_PROJECT_ID" \
            --quiet

      - name: Deploy application server to Cloud Run
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          args=(
            run deploy "$CLOUD_RUN_SERVICE"
            --source .
            --project "$FIREBASE_PROJECT_ID"
            --region "$CLOUD_RUN_REGION"
            --port 3000
            --allow-unauthenticated
            --quiet
          )

          if [[ -n "$GEMINI_API_KEY" ]]; then
            args+=(--set-env-vars "GEMINI_API_KEY=$GEMINI_API_KEY")
          else
            echo "::warning::GEMINI_API_KEY is not configured; deploying without updating that runtime variable."
          fi

          gcloud "${args[@]}"

      - name: Deploy Firebase Hosting
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
