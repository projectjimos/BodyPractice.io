name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodypractice-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "$FIREBASE_PROJECT_ID" ]] && missing+=("FIREBASE_PROJECT_ID")
          [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]] && missing+=("FIREBASE_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Firebase deployment is missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Smoke test live Firebase app
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"

          echo "Testing deployed homepage..."
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 \
            "$BASE_URL/" -o /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/home.html
          echo "PASS: Firebase homepage is reachable and contains the React mount point."

          echo "Testing production API health route..."
          API_STATUS=$(curl --silent --show-error --location \
            -o /tmp/api-health.out -w '%{http_code}' "$BASE_URL/api/health" || true)
          API_TYPE=$(curl --silent --show-error --head --location \
            "$BASE_URL/api/health" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2; exit}')

          echo "API /api/health status: $API_STATUS"
          echo "API /api/health content-type: ${API_TYPE:-unknown}"

          if [[ "$API_STATUS" == "200" ]] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/api-health.out; then
            echo "PASS: backend API health endpoint is live."
          else
            echo "::warning::Backend API is not live on Firebase Hosting. BioBot and AI-generated quizzes will not work until the Express API is deployed and /api/* is routed to it."
          fi
