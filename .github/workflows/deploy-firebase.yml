name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bodypractice-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "$FIREBASE_PROJECT_ID" ]] && missing+=("FIREBASE_PROJECT_ID")
          [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]] && missing+=("FIREBASE_SERVICE_ACCOUNT")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Firebase deployment is missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate audited anatomy data
        run: |
          npx --yes tsx@latest -e "import('./src/data/auditedOrganData.ts').then(() => console.log('PASS: audited anatomy data loads without runtime errors.'))"

      - name: Validate 700-question banks
        run: |
          npx --yes tsx@latest -e "import('./src/data/quizBanks.ts').then(({ QUIZ_BANKS }) => { const entries = Object.entries(QUIZ_BANKS); if (entries.length !== 7) throw new Error('Expected 7 body-system quiz banks.'); for (const [system, questions] of entries) { if (questions.length !== 100) throw new Error(system + ' has ' + questions.length + ' questions instead of 100.'); const ids = new Set(questions.map((q) => q.id)); if (ids.size !== 100) throw new Error(system + ' contains duplicate question IDs.'); for (const q of questions) { if (q.options.length !== 4) throw new Error(q.id + ' does not have 4 options.'); if (q.correctAnswerIndex < 0 || q.correctAnswerIndex > 3) throw new Error(q.id + ' has an invalid answer index.'); } console.log('PASS: ' + system + ' has 100 valid questions.'); } console.log('PASS: 700 total questions validated.'); })"

      - name: Build web app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Firebase Hosting
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive

      - name: Smoke test live Firebase app
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 \
            "$BASE_URL/" -o /tmp/home.html
          grep -q '<div id="root"></div>' /tmp/home.html
          grep -q '<title>BodyPractice.io</title>' /tmp/home.html
          echo "PASS: Firebase homepage is reachable and branded BodyPractice.io."

      - name: Browser smoke test live app
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const base = `https://${process.env.FIREBASE_PROJECT_ID}.web.app`;
            const browser = await chromium.launch({ headless: true, channel: 'chrome' });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', err => pageErrors.push(err.message));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });

            await page.goto(base, { waitUntil: 'networkidle' });
            await page.locator('header h1').filter({ hasText: 'BodyPractice' }).waitFor({ timeout: 15000 });
            if ((await page.title()) !== 'BodyPractice.io') throw new Error(`Unexpected page title: ${await page.title()}`);
            await page.locator('img[alt="BodyPractice.io human body logo"]').waitFor();

            const homeText = await page.locator('body').innerText();
            for (const forbidden of ['BioBot', 'AI Analogy Generator', 'More AI Analogies', 'AI Quiz']) {
              if (homeText.includes(forbidden)) throw new Error(`Removed AI feature still visible: ${forbidden}`);
            }
            console.log('PASS: BioBot and AI analogy/quiz controls are absent.');

            await page.getByRole('button', { name: /Lab Simulations/i }).click();
            await page.getByText('Interactive Simulation Lab').waitFor();
            console.log('PASS: Lab Simulations opens.');

            await page.getByRole('button', { name: /Quiz Master/i }).click();
            await page.getByText('100-Question Anatomy Mastery Bank').waitFor();
            await page.getByText('Question 1 of 100', { exact: true }).waitFor();
            await page.getByText('A', { exact: true }).first().click();
            await page.getByRole('button', { name: 'Submit Answer' }).click();
            await page.getByText('Explanation:').waitFor();
            console.log('PASS: 100-question quiz accepts and scores an answer.');

            const systemsRow = page.getByText('Body Systems:', { exact: true }).locator('..');
            const systemButtons = systemsRow.locator('button');
            const systemCount = await systemButtons.count();
            if (systemCount !== 7) throw new Error(`Expected 7 body-system buttons; found ${systemCount}.`);
            for (let i = 0; i < systemCount; i += 1) {
              await systemButtons.nth(i).click();
              await page.getByText('Question 1 of 100', { exact: true }).waitFor();
            }
            console.log('PASS: all 7 body systems load a 100-question bank.');

            await page.getByRole('button', { name: /Explorer/i }).click();
            const search = page.getByPlaceholder(/Search part/i);
            await search.fill('Retina');
            await page.getByRole('button').filter({ hasText: 'Retina' }).first().click();
            await page.getByRole('heading', { name: 'Retina' }).waitFor();
            console.log('PASS: Anatomy search returns a selectable structure.');

            if (pageErrors.length) throw new Error(`Browser page errors: ${pageErrors.join(' | ')}`);
            if (consoleErrors.length) throw new Error(`Browser console errors: ${consoleErrors.join(' | ')}`);

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
